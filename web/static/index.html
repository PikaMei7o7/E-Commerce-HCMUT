<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H&amp;M Analytics Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3.5-4 3 2.5L19 8"/></svg></span>
      <div><b>Analytics Hub</b><small>H&amp;M · star_schema</small></div>
    </div>

    <div class="nav-label">Workspace</div>
    <nav id="steps" class="nav">
      <button class="nav-item active" data-view="connect">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span>
        <span class="nav-txt">Connection</span>
      </button>
      <button class="nav-item" data-view="access" disabled>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <span class="nav-txt">Permissions</span>
      </button>
    </nav>

    <div class="nav-label">Dashboards</div>
    <nav id="dash-nav" class="nav"></nav>

    <div id="who" class="who" hidden></div>
  </aside>

  <main>
    <section id="view-connect" class="view"></section>
    <section id="view-access" class="view" hidden></section>
    <section id="view-dash" class="view" hidden></section>
  </main>
</div>
<div id="tip" class="tip" hidden></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
