<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H&amp;M Analytics Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
<script>
  // Áp dụng theme đã lưu trước khi render để tránh nháy màu
  try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3.5-4 3 2.5L19 8"/></svg></span>
      <div><b>Analytics Hub</b><small>H&amp;M · star_schema</small></div>
    </div>

    <div class="nav-label">Workspace</div>
    <nav id="steps" class="nav">
      <button class="nav-item active" data-view="connect">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span>
        <span class="nav-txt">Connection</span>
      </button>
      <button class="nav-item" data-view="access" disabled>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <span class="nav-txt">Permissions</span>
      </button>
    </nav>

    <div class="nav-label">Dashboards</div>
    <nav id="dash-nav" class="nav"></nav>

    <div class="side-foot">
      <button id="theme-toggle" class="nav-item theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="ic ic-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
        <span class="ic ic-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <span class="nav-txt">Dark mode</span>
      </button>
      <div id="who" class="who" hidden></div>
    </div>
  </aside>

  <main>
    <section id="view-connect" class="view"></section>
    <section id="view-access" class="view" hidden></section>
    <section id="view-dash" class="view" hidden></section>
  </main>
</div>
<div id="tip" class="tip" hidden></div>
<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
<script>
  (function () {
    const root = document.documentElement, btn = document.getElementById('theme-toggle');
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : mq.matches;
    const sync = () => {
      const d = isDark();
      btn.querySelector('.nav-txt').textContent = d ? 'Light mode' : 'Dark mode';
      btn.setAttribute('aria-pressed', d);
      root.classList.toggle('is-dark', d);
    };
    btn.addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';
      root.dataset.theme = next;
      try { localStorage.setItem('theme', next); } catch (e) {}
      sync();
    });
    mq.addEventListener('change', sync);
    sync();
  })();
</script>
</body>
</html>
